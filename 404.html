<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada — Nosso Projeto 3D</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0B07">
<!-- O GitHub Pages serve esta página em qualquer endereço inexistente de /site/, então os caminhos são absolutos -->
<link rel="icon" href="/site/assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/site/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/site/assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,400&family=Work+Sans:wght@400;500&family=JetBrains+Mono&display=swap">
<style>
  :root{
    --bg:#0E0B07; --line:#2A2217; --line-2:#3A3226;
    --gold:#C9A227; --gold-2:#E8C873;
    --text:#F4EFE3; --muted:#A69C87;
    --serif:'Fraunces',Georgia,serif; --sans:'Work Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
    --ease:cubic-bezier(.2,.8,.2,1);
    --fs-display:clamp(36px,5vw + 12px,72px);
    --fs-body-lg:clamp(16px,.2vw + 15px,17px);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;background:var(--bg);font-family:var(--sans);color:var(--text);
    -webkit-font-smoothing:antialiased;padding:48px 20px calc(48px + env(safe-area-inset-bottom,0px));}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;
    -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 45%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 60% 55% at 50% 45%,#000 10%,transparent 75%);opacity:.55;}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
  main{position:relative;max-width:620px;margin:0 auto;text-align:center;}
  .logo{width:56px;height:auto;margin:0 auto;display:block;opacity:.9;}
  .eyebrow{margin-top:36px;font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:inline-flex;align-items:center;gap:12px;}
  .eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:var(--gold);}
  h1{font-family:var(--serif);font-weight:300;font-size:var(--fs-display);line-height:1.05;letter-spacing:-.01em;margin:24px 0 0;}
  h1 em{font-style:italic;font-weight:400;color:var(--gold-2);}
  p{margin:24px auto 0;max-width:440px;font-size:var(--fs-body-lg);line-height:1.7;color:var(--muted);}
  .ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:40px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;font-weight:500;font-size:15px;white-space:nowrap;
    transition:transform .3s var(--ease),box-shadow .3s var(--ease),color .3s ease,border-color .3s ease;}
  .btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,#A8841A);color:#1A1308;
    clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 34px -12px rgba(201,162,39,.6);}
  .btn-ghost{border:1px solid var(--line-2);}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold-2);transform:translateY(-2px);}
  @media (max-width:760px){ .ctas .btn{flex:1 1 100%;} }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important;} }
</style>
</head>
<body>
<main>
  <img class="logo" src="/site/assets/logo.png" alt="Nosso Projeto 3D" width="254" height="300">
  <span class="eyebrow">Erro 404</span>
  <h1>Essa peça <em>não saiu da impressora.</em></h1>
  <p>A página que você procurou não existe ou mudou de lugar. Mas o resto do site está inteiro.</p>
  <div class="ctas">
    <a href="/site/" class="btn btn-primary">Voltar ao início</a>
    <a href="#" data-link="catalogo.site" class="btn btn-ghost">Ver catálogo</a>
  </div>
</main>
<script src="/site/assets/links.js"></script>
</body>
</html>
